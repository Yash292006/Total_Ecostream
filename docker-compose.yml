# Docker Compose configuration for EcoStream Spotify Clone
version: '3.8'

services:
  backend:
    build:
      context: ./backend      # Points Docker to the backend folder
      dockerfile: Dockerfile  # Tells it to look for the file inside that folder
    ports:
      - "5000:5000"
    environment:
      - PORT=5000

  frontend:
    build:
      context: ./frontend     # Points Docker to the frontend folder
      dockerfile: Dockerfile  # Tells it to look for the file inside that folder
    ports:
      - "80:80"
